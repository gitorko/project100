services:
  db-server:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock_exchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_exchange}
      POSTGRES_DB: ${POSTGRES_DB:-stock_exchange}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_exchange} -d ${POSTGRES_DB:-stock_exchange}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-server:5432/${POSTGRES_DB:-stock_exchange}
      POSTGRES_USER: ${POSTGRES_USER:-stock_exchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_exchange}
      POSTGRES_DB: ${POSTGRES_DB:-stock_exchange}
      STOCK_EXCHANGE_MATCHING_MODE: ${STOCK_EXCHANGE_MATCHING_MODE:-WHOLE_ORDER}
    ports:
      - "8080:8080"
    depends_on:
      db-server:
        condition: service_healthy

volumes:
  postgres-data:
